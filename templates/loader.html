<!-- Global Premium AI Loader Component -->
<div id="global-loader-overlay" class="global-loader-overlay d-none" aria-hidden="true" role="status">
    <div class="global-loader-card">
        <!-- Loader Graphic Visual Engine -->
        <div class="loader-visual-wrapper">
            <!-- Outer Rotating Ring -->
            <div class="loader-outer-ring"></div>
            
            <!-- Secondary Counter Ring -->
            <div class="loader-inner-ring"></div>

            <!-- Orbiting Dots Track -->
            <div class="loader-orbit-track">
                <div class="orbit-dot dot-1"></div>
                <div class="orbit-dot dot-2"></div>
                <div class="orbit-dot dot-3"></div>
            </div>

            <!-- Central AI Chip Core -->
            <div class="loader-ai-chip">
                <div class="chip-glow-effect"></div>
                <i class="bi bi-cpu-fill chip-icon"></i>
            </div>
        </div>

        <!-- Typography & Dynamic Status Message -->
        <div class="loader-content">
            <h3 class="loader-brand-title">Interview.ai</h3>
            <p id="loader-message" class="loader-message-text">Preparing your AI Interview...</p>
        </div>

        <!-- Subtle Animated Bottom Indicator -->
        <div class="loader-progress-line">
            <div class="progress-line-bar"></div>
        </div>
    </div>
</div>
