<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · Interview.ai</title><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head>
<body class="admin-login"><button class="login-theme" type="button" aria-label="Toggle theme">◐</button><main class="login-card"><a class="admin-brand" href="{{ url_for('landing') }}"><span>✦</span> Interview.ai</a><div class="login-kicker">SECURE ADMINISTRATION</div><h1>Welcome back</h1><p>Sign in with an authorized administrator account.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" id="adminLoginForm"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<div class="password-field"><input id="adminPassword" type="password" name="password" autocomplete="current-password" required><button type="button" id="passwordToggle" aria-label="Show password">Show</button></div></label><button type="submit" id="loginSubmit"><span>Sign in to Admin Panel</span><i></i></button></form><a class="back-link" href="{{ url_for('landing') }}">← Back to Interview.ai</a></main><script src="{{ url_for('static',filename='js/admin.js') }}"></script></body></html>
